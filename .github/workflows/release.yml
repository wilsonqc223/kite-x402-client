name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The published version installs the way users install it
        run: |
          # Release binaries are built in place, which never exercises the
          # module path. This is the command from the README, run for the
          # tag that was just published. Fetch straight from the repository
          # and skip the checksum database so a fresh tag cannot fail on
          # proxy or sumdb propagation.
          export GOPROXY=direct GONOSUMDB='github.com/wilsonqc223/*'
          module="github.com/${GITHUB_REPOSITORY,,}"
          for attempt in 1 2 3 4 5 6; do
            if go install "$module/cmd/kx402@${GITHUB_REF_NAME}" \
               && go install "$module/cmd/kx402-mcp@${GITHUB_REF_NAME}"; then break; fi
            echo "attempt $attempt failed; waiting for the tag to be resolvable"; sleep 10
          done
          bin="$(go env GOPATH)/bin"
          test -x "$bin/kx402" && test -x "$bin/kx402-mcp"
          "$bin/kx402" version
          "$bin/kx402" version | grep -q "${GITHUB_REF_NAME#v}" \
            || { echo "::error::the installed kx402 does not report ${GITHUB_REF_NAME}"; exit 1; }
